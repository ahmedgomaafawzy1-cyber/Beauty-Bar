<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beauty Bar | Products</title>

<style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background: #fcf7f5;
        color: #5b3b4b;
    }

    .navbar {
        height: 76px;
        padding: 0 7%;

        display: flex;
        align-items: center;
        justify-content: space-between;

        background: #fcf7f5;

        border-bottom: 1px solid #eadde3;
    }

    .logo {
        color: #965472;
        font-size: 21px;
        font-weight: bold;
        letter-spacing: 3px;
    }

    .nav-links {
        display: flex;
        gap: 30px;
    }

    .nav-links a {
        text-decoration: none;
        color: #765867;
        font-size: 14px;
    }

    .basket-link {
        text-decoration: none;
        color: white;
        background: #a65d7e;
        padding: 10px 20px;
        border-radius: 25px;
        font-size: 13px;
    }

    .page-header {
        text-align: center;
        padding: 70px 20px 40px;
    }

    .page-header span {
        color: #a65d7e;
        font-size: 11px;
        font-weight: bold;
        letter-spacing: 4px;
    }

    .page-header h1 {
        color: #6d4055;
        font-size: 48px;
        margin-top: 12px;
    }

    .page-header p {
        color: #806673;
        margin-top: 10px;
    }

    .products-grid {
        max-width: 1100px;
        margin: 0 auto;
        padding: 20px 25px 90px;

        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 25px;
    }

    .product-card {
        background: white;
        border-radius: 25px;
        overflow: hidden;

        box-shadow:
            0 10px 30px rgba(90, 55, 75, 0.10);

        transition: 0.3s ease;
    }

    .product-card:hover {
        transform: translateY(-8px);
    }

    .product-image {
        width: 100%;
        height: 260px;
        object-fit: cover;
        display: block;
        background: #f4e8ed;
    }

    .no-image {
        width: 100%;
        height: 260px;

        display: flex;
        align-items: center;
        justify-content: center;

        color: #9b7d8a;
        background: #f4e8ed;
    }

    .product-info {
        padding: 22px;
    }

    .product-info h3 {
        color: #704457;
        font-size: 21px;
        margin-bottom: 8px;
    }

    .description {
        color: #806b75;
        font-size: 13px;
        min-height: 42px;
    }

    .price {
        margin: 15px 0;
        color: #a65d7e;
        font-size: 18px;
        font-weight: bold;
    }

    .stock {
        display: inline-block;
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: bold;
        margin-bottom: 14px;
    }

    .available {
        color: #4d875c;
        background: #e5f3e8;
    }

    .sold-out {
        color: #a65063;
        background: #f7e1e5;
    }

    .cart-button {
        width: 100%;
        padding: 12px;

        border: none;
        border-radius: 25px;

        background: #a65d7e;
        color: white;

        cursor: pointer;
        font-weight: bold;

        transition: 0.3s;
    }

    .cart-button:hover {
        background: #914d6d;
    }

    .disabled-button {
        width: 100%;
        padding: 12px;

        border: none;
        border-radius: 25px;

        background: #ddd2d7;
        color: #806f78;

        cursor: not-allowed;
    }

    .empty {
        grid-column: 1 / -1;
        text-align: center;
        padding: 70px;
        color: #806b75;
    }

    @media (max-width: 800px) {

        .nav-links {
            display: none;
        }

        .products-grid {
            grid-template-columns: repeat(2, 1fr);
        }
    }

    @media (max-width: 550px) {

        .products-grid {
            grid-template-columns: 1fr;
        }

        .page-header h1 {
            font-size: 38px;
        }
    }

</style>

</head>

<body>

<header class="navbar">

    <div class="logo">
        BEAUTY BAR
    </div>

    <div class="nav-links">

        <a href="index.html">
            Home
        </a>

        <a href="products.html">
            Skin Care
        </a>

        <a href="index.html#about">
            About
        </a>

    </div>

    <a href="basket.html" class="basket-link">
        🛒 Basket <span id="basketCount">0</span>
    </a>

</header>


<section class="page-header">

    <span>
        BEAUTY BAR
    </span>

    <h1>
        Skin Care Products
    </h1>

    <p>
        Discover your skin care essentials.
    </p>

</section>


<div
    id="products"
    class="products-grid"
></div>


<script>

const API_URL = window.location.origin;


function updateBasketCount() {

    const basket =
        JSON.parse(
            localStorage.getItem("beautyBarBasket")
        ) || [];


    const count =
        basket.reduce(
            function (total, item) {
                return total + item.quantity;
            },
            0
        );


    document.getElementById(
        "basketCount"
    ).textContent = count;

}


function addToBasket(product) {

    const basket =
        JSON.parse(
            localStorage.getItem("beautyBarBasket")
        ) || [];


    const existing =
        basket.find(
            function (item) {
                return item.id === product.id;
            }
        );


    if (existing) {

        existing.quantity += 1;

    }

    else {

        basket.push({

            id: product.id,

            name: product.name,

            price: product.price,

            image: product.image,

            quantity: 1

        });

    }


    localStorage.setItem(
        "beautyBarBasket",
        JSON.stringify(basket)
    );


    updateBasketCount();

}


async function loadProducts() {

    try {

        const response =
            await fetch(
                `${API_URL}/api/products`
            );


        if (!response.ok) {

            throw new Error(
                "Could not load products"
            );

        }


        /*
            IMPORTANT:
            We intentionally load ALL products.
            There is NO category filtering here.
        */

        const products =
            await response.json();


        const container =
            document.getElementById(
                "products"
            );


        container.innerHTML = "";


        if (
            !Array.isArray(products) ||
            products.length === 0
        ) {

            container.innerHTML = `
                <div class="empty">
                    No products available yet.
                </div>
            `;

            return;

        }


        products.forEach(
            function (product) {

                const card =
                    document.createElement("div");


                card.className =
                    "product-card";


                let imageHTML;


                if (product.image) {

                    imageHTML = `
                        <img
                            src="${product.image}"
                            class="product-image"
                            alt="${product.name}"
                        >
                    `;

                }

                else {

                    imageHTML = `
                        <div class="no-image">
                            No Image
                        </div>
                    `;

                }


                const isAvailable =
                    product.stock_status === "Available";


                card.innerHTML = `

                    ${imageHTML}

                    <div class="product-info">

                        <h3>
                            ${product.name}
                        </h3>

                        <div class="description">
                            ${product.description || ""}
                        </div>

                        <div class="price">
                            ${product.price} EGP
                        </div>


                        ${
                            isAvailable
                            ?
                            `
                                <span class="stock available">
                                    Available
                                </span>

                                <button
                                    class="cart-button"
                                >
                                    Add to Cart
                                </button>
                            `
                            :
                            `
                                <span class="stock sold-out">
                                    Out of Stock
                                </span>

                                <button
                                    class="disabled-button"
                                    disabled
                                >
                                    Out of Stock
                                </button>
                            `
                        }

                    </div>

                `;


                if (isAvailable) {

                    card
                        .querySelector(
                            ".cart-button"
                        )
                        .addEventListener(
                            "click",
                            function () {

                                addToBasket(
                                    product
                                );


                                this.textContent =
                                    "Added ✓";


                                setTimeout(
                                    () => {

                                        this.textContent =
                                            "Add to Cart";

                                    },
                                    1000
                                );

                            }
                        );

                }


                container.appendChild(
                    card
                );

            }
        );

    }


    catch (error) {

        console.error(
            error
        );


        document.getElementById(
            "products"
        ).innerHTML = `

            <div class="empty">
                Could not connect to Beauty Bar.
            </div>

        `;

    }

}


updateBasketCount();

loadProducts();

</script>


</body>

</html>
